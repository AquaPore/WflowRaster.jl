#===========================================
#           TIMOLEAGUE
#-------------------------------------------
# ==== DIRECTORIES ====
dir_input = "data/input/Timoleague"
dir_output = "data/output/Timoleague"
fews_run__flag = false # <true> when coupled with DELTARES

[logging] # ===========================================
loglevel = "info" # <"debug">; <"info">; <"error">
silent = false
path_log = "Timoleague_log.txt"

[time] # ==============================================
# optional, default from forcing netCDF
# calendar     = "standard"  # <julian>; <proleptic_gregorian>; <standard>
starttime = 2021-01-01T00:00:00
endtime = 2021-03-01T00:00:00

[model] # ===========================================
type = "sbm" # <sbm> || <sbm_gwf> || <sediment>
cell_length_in_meter__flag = true # <false> Unit cell length of raster cells in x and y direction in lat/lon degree; <true> in meter
cold_start__flag = false # Cold state does not include values of storage at time=0
glacier__flag = false # Include glacier modelling
reservoir__flag = false # Include reservoir modelling
snow__flag = false # Include snow modelling
snow_gravitational_transport__flag = false # include lateral snow transport in the model, default is false
soil_infiltration_reduction__flag = false # <soil_infiltration_reduction> reduction of conductivity due to ice
water_mass_balance__flag = false # Compute water balance error
kinematic_wave__adaptive_time_step_flag = false # Enable kinematic wave adaptive (internal) timestepping
land_streamorder__min_count = 5 # Multi-Threading: Minimum stream order to delineate subbasins for river domain, default is 6 (for multi-threading computing purposes)
river_streamorder__min_count = 6 # Multi-Threading: Minimum stream order to delineate subbasins for land domain, default is 5 (for multi-threading computing purposes)
soil_layer__thickness = [
	100,
	300,
	800
] # [350, 700, 1000] # <config_soil_layer_thickness> [mm] specific SBM soil model setting: for each soil layer, a thickness is specified
saturated_hydraulic_conductivity_profile = "exponential" # <kh_profile_type>; [char]  |"layered"|,

[input] # ===========================================
path_forcing = "forcing-Timoleague_*.nc"
path_static = "staticmaps-Timoleague.nc"
# these are not directly part of the model
basin__local_drain_direction = "Ldd" # Local drain direction (1-9)
river_gauge__count = "Gauges_grdc"
river_location__mask = "River" # River mask (0-1)
subbasin_location__count = "Subcatchment" # Subbasin ids

# Author input
# ObservationEcologyPoint = "ObservationEcologyPoint"
[input.forcing] # -----------------------------
atmosphere_air__temperature = "temp"
atmosphere_water__precipitation_volume_flux = "precip"
land_surface_water__potential_evaporation_volume_flux = "pet"

[input.static] # -----------------------------
vegetation_canopy__gap_fraction.value = 0.1 # <canopygapfraction> [0-1] Canopy gap fraction if not computed from Lai
# ... Gash interception model: Δt > 24h ...
vegetation_canopy_water__mean_evaporation_to_mean_precipitation_ratio.value = 0.1 # [-] Gash interception model parameter, if not derived from Lai
# ... Rutter interception model: Δt < 24h rainfall_interception_modrut() ...
# vegetation_water__storage_capacity = "ScanopyMax" # <cmax> [mm] Maximum canopy storage, if not computed from LAI
vegetation_water__storage_capacity.value = 0.1
# ... Interception computed from LAI ...
#     cmax[i] = storage_specific_leaf[i] * leaf_area_index[i] + storage_wood[i]
#     canopygapfraction[i] = exp(-kext[i] * leaf_area_index[i])
# vegetation_canopy__light_extinction_coefficient = "vegetation_kext" # <kext> [0-1] Extinction coefficient (to calculate canopy gap fraction)
vegetation_canopy__light_extinction_coefficient.value = 0.6
# vegetation__specific_leaf_storage               = "vegetation_leaf_storage"
vegetation__specific_leaf_storage.value = 0.1 # <storage_specific_leaf> [mm] Specific leaf storage
# vegetation_wood_water__storage_capacity         = "vegetation_wood_storage" # <storage_wood> [mm] Storage woody part of vegetation
vegetation_wood_water__storage_capacity.value = 0.01
# ~~~~ ROOT WATER UPTAKE ~~~~
# ... Feddes et al. (1978) model  ...
# vegetation__crop_factor                                                 = "vegetation_crop_factor" # <kc>
# vegetation_root__depth                                                  = "vegetation_root_depth" # <rootingdepth> [mm] Rooting depth
vegetation_root__depth.value = 100.0
soil__thickness.value = 1500.0 #"SoilThickness" # [mm] <soilthickness>
# soil_layer_water__brooks_corey_exponent = "C_BrooksCorey" # [-] <c> Brooks-Corey power coefficient per soil layer
soil_layer_water__brooks_corey_exponent.value = 6.0
soil_water__residual_volume_fraction.value = 0.0 # <theta_r> residual soil moisture
# soil_water__saturated_volume_fraction   = "ThetaSat"  # <theta_s> Saturated soil moisture
soil_water__saturated_volume_fraction.value = 0.01 # <theta_s> Saturated soil moisture
#Test
soil_layer_water__vertical_saturated_hydraulic_conductivity.value = [
	0.00001,
	0.000001,
	0.0000001,
	0.0000001
] # [mm Δt⁻¹] Vertical saturated hydraulic conductivity per soil layer, when a layered or layered_exponential saturated hydraulic conductivity profile is used
soil_layer_water__vertical_saturated_hydraulic_conductivity_factor.value = [
	1.0,
	1.0,
	1.0,
	1.0
] # Multiplication factor applied to vertical turated hydraulic conductivity per soil layer
soil_water__vertical_saturated_hydraulic_conductivity_scale_parameter.value = 0.003
compacted_soil__area_fraction.value = 1.0
compacted_soil_surface_water__infiltration_capacity.value = 0.0 #  10.0
soil_water_saturated_zone_bottom__max_leakage_volume_flux.value = 0.0
soil_wet_root__sigmoid_function_shape_parameter.value = -500.0 # <rootdistpar>
# ~~~~ RIVER FLOW ~~~~
river__length = "RiverLength" # [m] <river_length>
river__slope = "RiverSlope" # [m m^-1] <slope>
river__width = "RiverWidth" # [m] <flow_width>
# river_water_flow__manning_n_parameter = "RiverManning" # Manning’s roughness [s m^1/3] <mannings_n>
river_water_flow__manning_n_parameter.value = 0.04 # "RiverManning" #
river_bank_water__depth.value = 3.0

land_surface__elevation = "Dtm"
land_surface__slope = "Slope" # [m m⁻¹] Land surface slope
land_surface_water_flow__manning_n_parameter.value = 0.27 # "land_manning_n" # <mannings_n>
subsurface_water__horizontal_to_vertical_saturated_hydraulic_conductivity_ratio.value = 1.0

[input.static.soil_surface_water__vertical_saturated_hydraulic_conductivity] # [m day-1] Vertical saturated hydraulic conductivity at soil surface
netcdf_variable_name = "Ks_Top"
scale = 1.0
offset = 0.0

[state] # ===========================================
path_input = "instates-Timoleague.nc"
path_output = "outstates-Timoleague.nc"

[state.variables] # -----------------------------
vegetation_canopy_water__depth = "canopystorage" # [mm]
soil_water_saturated_zone__depth = "satwaterdepth"
soil_surface__temperature = "tsoil"
soil_layer_water_unsaturated_zone__depth = "ustorelayerdepth"
river_water__depth = "h_river"
river_water__instantaneous_volume_flow_rate = "q_river"
subsurface_water__instantaneous_volume_flow_rate = "ssf"
land_surface_water__instantaneous_volume_flow_rate = "q_land"
land_surface_water__depth = "h_land"

# Output of interest
[output.netcdf_grid] # ===========================================
path = "Output_Timoleague.nc"
compressionlevel = 0 # Compression level [0-9]

[output.netcdf_grid.variables]
# Forcing data
atmosphere_water__precipitation_volume_flux = "atmosphere_water__precipitation_volume_flux"
land_surface_water__potential_evaporation_volume_flux = "land_surface_water__potential_evaporation_volume_flux"
# Rainfall interception
# vegetation_canopy_water__depth                      = "CanopyStorage" # [mm / ΔT]
vegetation_canopy_water__interception_volume_flux = "vegetation_canopy_water__interception_volume_flux" # [mm / ΔT]
land_surface__evapotranspiration_volume_flux = "land_surface__evapotranspiration_volume_flux" # [mm / ΔT]
soil_layer_water__volume_fraction = "soil_layer_water__volume_fraction" # [%] Soil layer water content as percentage of soil layer thickness
# Overland flow
land_surface_water__volume_flow_rate = "land_surface_water__volume_flow_rate" # [m3 / s]
land_surface_water__to_river_volume_flow_rate = "land_surface_water__to_river_volume_flow_rate" # [m3 / s]
compacted_soil_surface_water__excess_volume_flux = "compacted_soil_surface_water__excess_volume_flux" # Excess water for 
soil_water__infiltration_volume_flux = "soil_water__infiltration_volume_flux" # Actual infiltration into the unsaturated zone [mm / DeltaT]
# Subsurface flow
subsurface_water__volume_flow_rate = "subsurface_water__volume_flow_rate" # [m3 / day]

[output.csv] # ===========================================
# <maximum>, <minimum>, <mean>, <median>, <sum>, <first>, <last>, <only>
path = "output_Timoleague.csv"

[[output.csv.column]]
header = "Qriver"
map = "river_gauge__count"
parameter = "river_water__volume_flow_rate"
